<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Slope Shift</title>
<meta name="description" content="You are the regression line. An IB Computer Science linear regression game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0c1a; --panel: #1b1831; --line: #3a3460; --text: #f1eefc; --muted: #a9a3c9;
    --beam: #3fd8e8; --gold: #f4c84a; --bad: #ff6b6b; --good: #6be38f; --count: #b06cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Space Grotesk", system-ui, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px 10px 20px; }
  #game { position: relative; width: 100%; max-width: 1180px; }
  canvas { display: block; width: 100%; height: auto; border-radius: 16px; border: 2px solid var(--line); background: #110f20; touch-action: none; user-select: none; -webkit-user-select: none; }
  #bar {
    width: 100%; max-width: 1180px; margin-top: 10px; min-height: 76px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 16px;
    padding: 12px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  #prompt { flex: 1 1 380px; font-size: 17px; line-height: 1.45; }
  #prompt b { color: var(--gold); }
  #prompt .eq { font-weight: 700; color: var(--beam); white-space: nowrap; }
  #prompt .ok { color: var(--good); font-weight: 700; }
  #prompt .no { color: var(--bad); font-weight: 700; }
  #actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font-family: "Press Start 2P", monospace; font-size: 12px; line-height: 1.4;
    color: #15121f; background: var(--beam); border: 0; border-radius: 12px;
    padding: 13px 16px; cursor: pointer;
  }
  button.gold { background: var(--gold); }
  button.ghost { background: transparent; color: var(--text); border: 2px solid var(--line); }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(14,12,26,.82); border-radius: 16px; padding: 18px;
  }
  #overlay[hidden] { display: none; }
  .card {
    max-width: 640px; width: 100%; background: var(--panel); border: 2px solid var(--line);
    border-radius: 18px; padding: 26px 26px 22px; text-align: center; max-height: 100%; overflow: auto;
  }
  .card h1 { font-family: "Press Start 2P", monospace; font-size: clamp(22px, 4vw, 38px); margin: 0 0 6px; color: var(--beam); line-height: 1.3; }
  .card h2 { font-family: "Press Start 2P", monospace; font-size: clamp(14px, 2.4vw, 20px); margin: 0 0 12px; color: var(--gold); line-height: 1.5; }
  .card p { color: var(--muted); margin: 8px 0; line-height: 1.5; font-size: 16px; }
  .card p strong { color: var(--text); }
  .card .big { font-family: "Press Start 2P", monospace; font-size: 30px; color: var(--gold); margin: 10px 0; }
  .card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; text-align: left; margin: 14px auto 4px; max-width: 460px; font-size: 15px; color: var(--muted); }
  .keys kbd { font-family: "Space Grotesk", sans-serif; font-weight: 700; color: var(--text); background: #2a2549; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
  .tagline { font-size: 13px !important; letter-spacing: .08em; text-transform: uppercase; color: var(--count) !important; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { font-family: "Space Grotesk", sans-serif; font-size: 15px; font-weight: 700; background: #2a2549; color: var(--text); border: 2px solid var(--line); border-radius: 999px; padding: 8px 14px; }
  .chip.sel { border-color: var(--gold); color: var(--gold); }
  .chip.used { opacity: .35; }
  .slots { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .slot { flex: 1 1 220px; min-height: 64px; border: 2px dashed var(--line); border-radius: 12px; padding: 8px 10px; background: #15122a; cursor: pointer; text-align: left; font-family: "Space Grotesk", sans-serif; font-size: 14px; color: var(--muted); }
  .slot .lbl { font-weight: 700; color: var(--text); display: block; margin-bottom: 4px; }
  .slot .in { display: inline-block; background: var(--beam); color: #15121f; border-radius: 999px; padding: 3px 10px; margin: 2px 4px 2px 0; font-weight: 700; }
  #mute { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 10px; padding: 8px 10px; background: rgba(42,37,73,.9); color: var(--text); }
  @media (max-width: 600px) { #prompt { font-size: 15px; } button { font-size: 11px; padding: 12px 12px; } .card { padding: 18px 14px; } }
  @media (max-width: 760px) {
    #overlay { position: fixed; border-radius: 0; z-index: 10; background: rgba(14,12,26,.92); }
    #mute { font-size: 8px; padding: 5px 7px; top: 4px; }
  }
  #rotate { display: none; width: 100%; max-width: 1180px; margin-top: 8px; color: var(--muted); font-size: 14px; text-align: center; }
  @media (max-width: 760px) and (orientation: portrait) { #rotate { display: block; } }
</style>
</head>
<body>
<div id="game">
  <canvas id="c" width="1280" height="800" aria-label="Slope Shift game"></canvas>
  <button id="mute" class="ghost" type="button" aria-label="Toggle sound">SOUND: ON</button>
  <div id="overlay"></div>
</div>
<div id="bar"><div id="prompt"></div><div id="actions"></div></div>
<div id="rotate">Tip: turn your phone sideways for a bigger board.</div>

<script>
(() => {
"use strict";
// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
const W = 1280, H = 800;
const PW_FULL = W - 100 - 44;
const P = { x: 100, y: 128, w: PW_FULL, h: H - 128 - 76 };   // plot rectangle
function setPlot(narrow) { P.w = narrow ? Math.round(PW_FULL * 0.62) : PW_FULL; }
const COUNT_POS = { x: W - 92, y: 80 };
const C = { beam: '#3fd8e8', gold: '#f4c84a', bad: '#ff6b6b', good: '#6be38f', count: '#b06cff', text: '#f1eefc', muted: '#a9a3c9', line: '#3a3460', grid: 'rgba(255,255,255,0.06)' };
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- levels ----------
const LEVELS = [
  { name: 'The Study Session', story: 'Count Scatter has scrambled the class data on study time and test scores.',
    xName: 'Hours studied', xU: 'hours', yName: 'Test score', yU: '%', yThing: 'test score', yChange: 'percentage points',
    xStep: 'each extra hour studied', x0Phrase: 'a student studies for 0 hours',
    xmin: 0, xmax: 10, ymin: 30, ymax: 100, dx: [0.5, 9.5], m: 4.5, b: 47, sd: 4.5, n: 16 },
  { name: 'Cocoa Crisis', story: 'The cafe tracked hot cocoa sales against the temperature. Count Scatter wants the cocoa to stay a mystery.',
    xName: 'Temperature', xU: '°C', yName: 'Hot cocoa sold', yU: 'cups', yThing: 'number of cups sold', yChange: 'cups',
    xStep: 'each 1 °C rise in temperature', x0Phrase: 'the temperature is 0 °C',
    xmin: -5, xmax: 25, ymin: 0, ymax: 240, dx: [-4, 24], m: -5.5, b: 185, sd: 11, n: 18 },
  { name: 'Midnight Scroll', story: 'A survey compared daily screen time with hours of sleep. The Count is up past bedtime, throwing outliers.',
    xName: 'Screen time', xU: 'hours/day', yName: 'Sleep', yU: 'hours', yThing: 'sleep', yChange: 'hours',
    xStep: 'each extra hour of screen time', x0Phrase: 'screen time is 0 hours',
    xmin: 0, xmax: 10, ymin: 3, ymax: 10, dx: [1, 9], m: -0.38, b: 9.3, sd: 0.45, n: 18 },
  { name: 'Server Meltdown', story: 'The school server slows down as more users log in. Count Scatter is shoving the line around now.',
    xName: 'Users online', xU: 'hundreds', yName: 'Response time', yU: 'ms', yThing: 'response time', yChange: 'ms',
    xStep: 'each extra 100 users online', x0Phrase: 'there are 0 users online',
    xmin: 0, xmax: 20, ymin: 0, ymax: 200, dx: [1, 19], m: 6.5, b: 38, sd: 11, n: 20 },
  { name: "The Count's Lair", story: 'Final showdown. An app compared ads shown with downloads. The Count throws everything he has.',
    xName: 'Ads shown', xU: 'thousands', yName: 'App downloads', yU: 'hundreds', yThing: 'number of downloads', yChange: 'hundred downloads',
    xStep: 'each extra 1,000 ads shown', x0Phrase: '0 ads are shown',
    xmin: 0, xmax: 30, ymin: 0, ymax: 100, dx: [1, 29], m: 2.1, b: 14, sd: 8, n: 22 }
];
const METEOR_GAP = [4.6, 3.9, 3.3, 2.8, 2.2];
const GUST_GAP = [Infinity, 9, 7.5, 6, 4.5];
const FEED_TIME = 36;
const SCHEDULE = [
  ['axes', 'slope', 'predict'],
  ['rpick', 'tune', 'residualClick'],
  ['rinterpret', 'predict', 'intercept'],
  ['byeye', 'static1', 'tune'],
  ['extrapolation', 'meanpoint', 'static2']
];
const TOTAL_Q = SCHEDULE.reduce((a, s) => a + s.length, 0);

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function decimalsFor(v) { const a = Math.abs(v); return a >= 100 ? 0 : a >= 10 ? 1 : 2; }
function fmt(v, d) { if (d === undefined) d = decimalsFor(v); const s = (+v.toFixed(d)); return (Object.is(s, -0) ? 0 : s).toString().replace('-', '−'); }
function num(v, d) { if (d === undefined) d = decimalsFor(v); return +v.toFixed(d); }
function eqStr(m, b) { const bs = b < 0 ? '− ' + fmt(Math.abs(b)) : '+ ' + fmt(b); return 'ŷ = ' + fmt(m) + 'x ' + bs; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function fitOf(pts) {
  const n = pts.length; let mx = 0, my = 0;
  for (const p of pts) { mx += p.x; my += p.y; } mx /= n; my /= n;
  let sxx = 0, sxy = 0, syy = 0;
  for (const p of pts) { sxx += (p.x - mx) ** 2; sxy += (p.x - mx) * (p.y - my); syy += (p.y - my) ** 2; }
  const m = sxy / sxx, b = my - m * mx, r = sxy / Math.sqrt(sxx * syy);
  return { m, b, r, r2: r * r, mx, my };
}
function r2Of(pts, m, b) {
  if (pts.length < 3) return 0;
  let my = 0; for (const p of pts) my += p.y; my /= pts.length;
  let ssr = 0, sst = 0;
  for (const p of pts) { ssr += (p.y - (m * p.x + b)) ** 2; sst += (p.y - my) ** 2; }
  return sst === 0 ? 0 : 1 - ssr / sst;
}
function genPoints(L, n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const x = L.dx[0] + (i + rand(0.1, 0.9)) / n * (L.dx[1] - L.dx[0]);
    let y = L.m * x + L.b + gauss() * L.sd;
    y = clamp(y, L.ymin + 0.03 * (L.ymax - L.ymin), L.ymax - 0.03 * (L.ymax - L.ymin));
    pts.push({ x, y });
  }
  return pts;
}
function niceStep(range, target) { const raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
function niceRound(v) { if (v === 0) return 0; const p = Math.pow(10, Math.floor(Math.log10(Math.abs(v)))); return Math.round(v / p * 2) / 2 * p; }

// ---------- coordinate mapping ----------
let L = LEVELS[0];
const xr = () => L.xmax - L.xmin, yr = () => L.ymax - L.ymin;
const sx = x => P.x + (x - L.xmin) / xr() * P.w;
const sy = y => P.y + P.h - (y - L.ymin) / yr() * P.h;
const wx = px => L.xmin + (px - P.x) / P.w * xr();
const wy = py => L.ymin + (P.y + P.h - py) / P.h * yr();
const XL = () => L.xmin + 0.08 * xr(), XR = () => L.xmax - 0.08 * xr();

// ---------- sound ----------
let audio = null, soundOn = true;
try { soundOn = localStorage.getItem('slopeshift-sound') !== 'off'; } catch (e) {}
function beep(f, d = 0.12, type = 'square', vol = 0.05, slide = 0) {
  if (!soundOn) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const sfx = {
  pop: () => beep(660, 0.09, 'square', 0.04, 300),
  land: () => beep(180, 0.18, 'sawtooth', 0.04, -80),
  good: () => { beep(523, 0.1, 'triangle', 0.07); setTimeout(() => beep(784, 0.16, 'triangle', 0.07), 90); },
  bad: () => beep(150, 0.3, 'sawtooth', 0.05, -60),
  blast: () => beep(220, 0.45, 'sawtooth', 0.06, 700),
  tick: () => beep(1100, 0.03, 'square', 0.02),
  laugh: () => { [0, 110, 220].forEach((t, i) => setTimeout(() => beep(320 - i * 40, 0.09, 'square', 0.035), t)); }
};
const muteBtn = document.getElementById('mute');
function updateMute() { muteBtn.textContent = 'SOUND: ' + (soundOn ? 'ON' : 'OFF'); }
muteBtn.addEventListener('click', () => { soundOn = !soundOn; try { localStorage.setItem('slopeshift-sound', soundOn ? 'on' : 'off'); } catch (e) {} updateMute(); muteBtn.blur(); });
updateMute();

// ---------- DOM bar / overlay ----------
const promptEl = document.getElementById('prompt'), actionsEl = document.getElementById('actions'), overlay = document.getElementById('overlay');
function setBar(html, buttons = []) {
  promptEl.innerHTML = html; actionsEl.innerHTML = '';
  for (const b of buttons) {
    const el = document.createElement('button'); el.type = 'button'; el.textContent = b.label;
    if (b.cls) el.className = b.cls; if (b.id) el.id = b.id;
    el.addEventListener('click', () => { el.blur(); b.fn(); });
    actionsEl.appendChild(el);
  }
}
function showOverlay(html, buttons = []) {
  overlay.innerHTML = '<div class="card">' + html + '<div class="row"></div></div>';
  const row = overlay.querySelector('.row');
  for (const b of buttons) {
    const el = document.createElement('button'); el.type = 'button'; el.textContent = b.label; if (b.cls) el.className = b.cls;
    el.addEventListener('click', () => { el.blur(); b.fn(); }); row.appendChild(el);
  }
  overlay.hidden = false;
  const first = row.querySelector('button'); if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);
}
function hideOverlay() { overlay.hidden = true; overlay.innerHTML = ''; }

// ---------- game state ----------
const S = {
  mode: 'title', level: 0, score: 0, hp: 100, correct: 0, asked: 0, levelCorrect: 0, levelScore: 0,
  pts: [], fit: null, line: { yL: 0, yR: 0, vL: 0, vR: 0 }, feed: null, q: null, qi: 0, qList: [],
  t: 0, particles: [], texts: [], beams: [], count: { wob: 0, say: '', sayT: 0, hurt: 0 }, enterFn: null
};
if (/[?&]test\b/.test(location.search)) window.SS = S; // test hook (add ?test to the URL)

const keys = new Set();
const lineM = () => (S.line.yR - S.line.yL) / (XR() - XL());
const lineB = () => S.line.yL - lineM() * XL();
const lineY = x => S.line.yL + (x - XL()) * lineM();

function addText(x, y, s, color = C.gold, size = 22) { S.texts.push({ x, y, s, color, size, t: 0 }); }
function burst(x, y, color, n = 14) {
  if (reduceMotion) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), v = rand(80, 260); S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 0.8), t: 0, color }); }
}
const TAUNTS = ['Outliers are my friends!', 'Scattered! Ha!', 'r = 0, forever!', 'Fit THIS!', 'My data, my rules!', 'Noise is beautiful!'];
const OUCH = ['Ugh! A strong correlation!', 'Too… well… fitted…', 'Not the line of best fit!', 'My scatter! Nooo!', 'Curse your gradient!'];
function countSay(s, t = 2.2) { S.count.say = s; S.count.sayT = t; }
function hitCount(dmg, fromX, fromY) {
  S.hp = Math.max(0, S.hp - dmg); S.count.hurt = 0.6; S.count.wob = 1;
  S.beams.push({ x1: fromX, y1: fromY, x2: COUNT_POS.x, y2: COUNT_POS.y, t: 0 });
  burst(COUNT_POS.x, COUNT_POS.y, C.count, 18); countSay(pick(OUCH));
}
function healCount(n) { S.hp = Math.min(100, S.hp + n); countSay(pick(TAUNTS)); sfx.laugh(); }
function addScore(n, x, y) { S.score += n; S.levelScore += n; if (x !== undefined) addText(x, y, '+' + n, C.gold, 20); }

// ---------- flow ----------
function titleScreen() {
  S.mode = 'title'; L = LEVELS[0]; S.pts = genPoints(L, 16); S.fit = fitOf(S.pts);
  S.line.yL = lineYfromFit(XL()); S.line.yR = lineYfromFit(XR());
  let best = 0; try { best = +localStorage.getItem('slopeshift-best') || 0; } catch (e) {}
  setBar('IB Math: Applications &amp; Interpretation · Statistics · Linear regression');
  showOverlay(
    '<p class="tagline">An IB Math AI regression game</p><h1>SLOPE SHIFT</h1>' +
    '<p><strong>You are the line of best fit.</strong> Count Scatter is flinging outliers to wreck everyone’s data. Hug the trend, blast him with your fit, and answer his challenges using the line itself.</p>' +
    '<div class="keys">' +
    '<kbd>↑ ↓ / W S</kbd><span>shift the line up and down</span>' +
    '<kbd>← → / A D</kbd><span>tilt the line (change the slope)</span>' +
    '<kbd>Drag</kbd><span>grab either end of the line (mouse or finger)</span>' +
    '<kbd>Click</kbd><span>pop red outlier meteors before they land</span>' +
    '<kbd>Space</kbd><span>fire your fit blast when it’s charged</span>' +
    '</div>' + (best ? '<p>Your best score: <strong>' + best + '</strong></p>' : ''),
    [{ label: 'START ▸', fn: () => { resetGame(); levelIntro(); } }]);
  S.enterFn = () => { resetGame(); levelIntro(); };
}
function lineYfromFit(x) { return S.fit.m * x + S.fit.b; }
function resetGame() { S.level = 0; S.score = 0; S.hp = 100; S.correct = 0; S.asked = 0; }

function levelIntro() {
  L = LEVELS[S.level]; S.levelCorrect = 0; S.levelScore = 0;
  S.pts = genPoints(L, L.n); S.fit = fitOf(S.pts);
  S.line = { yL: (L.ymin + L.ymax) / 2, yR: (L.ymin + L.ymax) / 2, vL: 0, vR: 0 };
  S.mode = 'intro';
  const extra = S.level === 1 ? '<p><strong>New:</strong> outliers that land will <strong>pull your line</strong> toward them. Click them to clean them up.</p>'
    : S.level === 3 ? '<p><strong>New:</strong> Count Scatter shoves your line. Steady it!</p>'
    : S.level === 4 ? '<p><strong>Boss level.</strong> More meteors, harder shoves. Finish him!</p>' : '';
  setBar('<b>Level ' + (S.level + 1) + ' of 5</b> · ' + esc(L.xName) + ' vs ' + esc(L.yName));
  showOverlay('<p class="tagline">Level ' + (S.level + 1) + ' of 5</p><h2>' + esc(L.name) + '</h2><p>' + esc(L.story) + '</p>' +
    '<p><strong>Phase 1:</strong> ride the trend as the data lands. The closer you fit, the faster your fit blast charges.</p>' +
    '<p><strong>Phase 2:</strong> three of Count Scatter’s challenges.</p>' + extra,
    [{ label: 'GO ▸', fn: startFeed }]);
  S.enterFn = startFeed;
}

function startFeed() {
  hideOverlay(); setPlot(false); S.mode = 'feed';
  S.feed = { t: 0, pending: shuffle(S.pts), landed: [], falling: [], meteors: [], corrupt: [],
    nextSpawn: 0.4, nextMeteor: 3, nextGust: GUST_GAP[S.level], charge: 0, r2: 0, scoreAcc: 0 };
  S.enterFn = null;
  feedBar();
}
function feedBar() {
  const f = S.feed, ready = f.charge >= 1;
  setBar('<b>Ride the trend!</b> Keep the line close to the data. Pop the <span class="no">red meteors</span>. ' +
    (ready ? '<span class="ok">Fit blast ready: press Space!</span>' : 'Fit well to charge your fit blast.'),
    ready ? [{ label: 'BLAST ▸', cls: 'gold', fn: fireBlast }] : []);
  f.barReady = ready;
}
function fireBlast() {
  const f = S.feed; if (!f || S.mode !== 'feed' || f.charge < 1) return;
  f.charge = 0; sfx.blast();
  const mx = (XL() + XR()) / 2; hitCount(3, sx(mx), sy(lineY(mx))); addScore(50, sx(mx), sy(lineY(mx)) - 20);
  feedBar();
}

// ---------- questions ----------
function cardsBegin(q, prompt, options, correctIdx, explain, compact) {
  const order = shuffle(options.map((t, i) => ({ t, ok: i === correctIdx })));
  q.cards = order.map((o, i) => ({ text: o.t, ok: o.ok, phase: rand(0, 6.28), speed: rand(0.35, 0.6) * (Math.random() < 0.5 ? -1 : 1), shake: 0, state: '' }));
  q.compact = compact; q.explain = explain; setPlot(compact);
  q.layout();
  setBar(prompt + ' <span style="color:#a9a3c9">Click a card or press 1–4.</span>');
}
function cardRects(q) {
  const out = [];
  if (q.compact) {
    const x0 = P.x + P.w + 20, colW = (W - 20 - x0) / 2, cw = Math.min(196, colW - 12), ch = 70;
    q.cards.forEach((c, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const bx = x0 + col * colW + (colW - cw) / 2, by = P.y + 70 + row * 220;
      out.push({ x: bx, y: by + Math.sin(S.t * Math.abs(c.speed) * 2 + c.phase) * 50, w: cw, h: ch });
    });
  } else {
    const cw = 600, ch = 92, gap = (P.h - 4 * ch) / 5;
    q.cards.forEach((c, i) => {
      const amp = (P.w - cw) / 2 - 10, cx = P.x + P.w / 2 + Math.sin(S.t * c.speed + c.phase) * amp;
      out.push({ x: cx - cw / 2, y: P.y + gap + i * (ch + gap), w: cw, h: ch });
    });
  }

}
function chooseCard(q, i) {
  if (q.done || !q.cards[i]) return;
  const c = q.cards[i]; c.state = c.ok ? 'ok' : 'no'; if (!c.ok) { c.shake = 0.5; q.cards.forEach(k => { if (k.ok) k.state = 'ok'; }); }
  const r = cardRects(q)[i]; burst(r.x + r.w / 2, r.y + r.h / 2, c.ok ? C.good : C.bad, 16);
  answer(c.ok, q.explain);
}
function cardQuestion(build) {
  const q = {
    begin() { build(q); }, layout() {},
    draw() {
      drawAxes(); if (!q.compact) { drawPoints(S.pts, 0.35); ctx.fillStyle = 'rgba(14,12,26,0.35)'; ctx.fillRect(P.x, P.y, P.w, P.h); } else { drawPoints(S.pts, 1); if (q.showFit) drawFitLine(S.fit, C.gold, true); }
      if (q.done && q.after) q.after();
      cardRects(q).forEach((r, i) => drawCard(q.cards[i], r, i));
    },
    down(px, py) { const rs = cardRects(q); for (let i = 0; i < rs.length; i++) { const r = rs[i]; if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) { chooseCard(q, i); return; } } },
    key(k) { if (k >= '1' && k <= '4') chooseCard(q, +k - 1); }

}

function strengthOf(r) { const a = Math.abs(r); return a >= 0.75 ? 'strong' : a >= 0.5 ? 'moderate' : a >= 0.25 ? 'weak' : 'very weak'; }
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
function makeQuestion(type) {
  const fit = S.fit, mR = num(fit.m), bR = num(fit.b), EQ = '<span class="eq">' + eqStr(fit.m, fit.b) + '</span>';
  const yT = L.yThing;
  switch (type) {
    case 'slope': return cardQuestion(q => {
      const up = mR > 0, mag = fmt(Math.abs(mR));
      cardsBegin(q, 'The model is ' + EQ + ' (x = ' + esc(L.xName.toLowerCase()) + ', y = ' + esc(L.yName.toLowerCase()) + '). <b>What does the gradient ' + fmt(mR) + ' mean?</b>', [
        'For ' + L.xStep + ', the predicted ' + yT + (up ? ' rises' : ' falls') + ' by ' + mag + ' ' + L.yChange,
        'The predicted ' + yT + ' is ' + fmt(mR) + ' ' + L.yU + ' when ' + L.x0Phrase,
        'For ' + L.xStep + ', the predicted ' + yT + (up ? ' falls' : ' rises') + ' by ' + mag + ' ' + L.yChange,
        'About ' + mag + '% of the data points lie exactly on the line'
      ], 0, 'The gradient is the change in the predicted y for each 1-unit increase in x. Here, for ' + esc(L.xStep) + ', the predicted ' + esc(yT) + (up ? ' rises' : ' falls') + ' by ' + mag + ' ' + esc(L.yChange) + '.', false);
    });

      cardsBegin(q, 'The model is ' + EQ + '. <b>What does the y-intercept ' + fmt(bR) + ' represent?</b>', [
        'The predicted ' + yT + ' when ' + L.x0Phrase,
        'How much the predicted ' + yT + ' changes for ' + L.xStep,
        'The largest ' + yT + ' in the data set',
        'Pearson’s correlation coefficient r for this data'

        (outside ? ' Careful: the data starts at x = ' + fmt(L.dx[0], 1) + ', so x = 0 is outside the data and this value is an extrapolation.' : ''), false);
    });

      const opts = [rc];

        [out].concat(inside).map(v => 'Predicting ' + yT + ' when ' + L.xName.toLowerCase() + ' = ' + fmt(v) + ' ' + L.xU), 0,

const STATIC = [

function predictQuestion() {

function residualClickQuestion() {

    const f = S.feed, bx = 330, by = 30, bw = 250;
    label('FIT ' + Math.round(clamp(f.r2, 0, 1) * 100) + '%', bx, by + 14, C.text, 13, 'left', 'Press Start 2P', 400);
    ctx.fillStyle = '#2a2549'; ctx.fillRect(bx, by + 24, bw, 12); ctx.fillStyle = f.r2 >= 0.6 ? C.good : C.bad; ctx.fillRect(bx, by + 24, bw * clamp(f.r2, 0, 1), 12);
    label('BLAST', bx, by + 64, C.text, 11, 'left', 'Press Start 2P', 400);
    ctx.fillStyle = '#2a2549'; ctx.fillRect(bx + 70, by + 52, bw - 70, 12); ctx.fillStyle = C.gold; ctx.fillRect(bx + 70, by + 52, (bw - 70) * f.charge, 12);
    // time bar
    ctx.fillStyle = '#2a2549'; ctx.fillRect(P.x, P.y - 10, P.w, 5); ctx.fillStyle = C.beam; ctx.fillRect(P.x, P.y - 10, P.w * (1 - f.t / FEED_TIME), 5);
  }
}
function drawFeed() {
  const f = S.feed;
  drawAxes();
  // residual tethers
  clipPlot(() => {
    for (const p of f.landed) { const e = Math.abs(p.y - lineY(p.x)) / yr(); ctx.strokeStyle = e < 0.06 ? 'rgba(107,227,143,.55)' : e < 0.15 ? 'rgba(244,200,74,.45)' : 'rgba(255,107,107,.45)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(p.x), sy(p.y)); ctx.lineTo(sx(p.x), sy(lineY(p.x))); ctx.stroke(); }
    for (const c of f.corrupt) { ctx.strokeStyle = 'rgba(255,107,107,.7)'; ctx.setLineDash([4, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(c.x), sy(c.y)); ctx.lineTo(sx(c.x), sy(lineY(c.x))); ctx.stroke(); ctx.setLineDash([]); }
  });
  drawPlayerLine(true);
  for (const p of f.landed) { const near = Math.abs(p.y - lineY(p.x)) / yr() < 0.06; ctx.save(); if (near) { ctx.shadowColor = C.beam; ctx.shadowBlur = 12; } dot(sx(p.x), sy(p.y), near ? 8 : 7, near ? '#9ff3fb' : C.beam); ctx.restore(); }
  for (const p of f.falling) { const t = p.t / p.dur, e = 1 - (1 - t) * (1 - t); const Y = lerp(P.y, sy(p.y), e); ctx.save(); ctx.globalAlpha = 0.4 + 0.6 * t; dot(sx(p.x), Y, 7, C.beam); ctx.restore(); }
  for (const c of f.corrupt) { const j = reduceMotion ? 0 : Math.sin(S.t * 20 + c.x) * 2; const X = sx(c.x) + j, Y = sy(c.y); dot(X, Y, 11, C.bad); ctx.strokeStyle = '#15121f'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(X - 5, Y - 5); ctx.lineTo(X + 5, Y + 5); ctx.moveTo(X + 5, Y - 5); ctx.lineTo(X - 5, Y + 5); ctx.stroke(); }
  for (const m of f.meteors) {
    const p = meteorPos(m); ctx.save(); ctx.shadowColor = C.bad; ctx.shadowBlur = 18; dot(p.x, p.y, 15, C.bad); ctx.restore();
    dot(p.x - 4, p.y - 4, 4, '#ffd0d0');
    // landing marker
    ctx.save(); ctx.strokeStyle = 'rgba(255,107,107,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx(m.tx), sy(m.ty), 16 * (1 - m.t / m.dur) + 6, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
}
function drawReveal() {
  drawAxes();
  clipPlot(() => { for (const p of S.pts) residualBar(p, S.fit, 'rgba(244,200,74,.4)', false); });
  drawPlayerLine(true); drawFitLine(S.fit, C.gold, true); drawPoints(S.pts); drawMeanPoint(S.fit.mx, S.fit.my);
  label('Regression line: ' + eqStr(S.fit.m, S.fit.b), P.x + 14, P.y + 56, C.gold, 20, 'left');
}
function drawMeanPoint(mx, my, withLabel = true) {
  const X = sx(mx), Y = sy(my);
  ctx.save(); ctx.strokeStyle = '#15121f'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(X - 12, Y - 12); ctx.lineTo(X + 12, Y + 12); ctx.moveTo(X + 12, Y - 12); ctx.lineTo(X - 12, Y + 12); ctx.stroke();
  ctx.strokeStyle = C.gold; ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath(); ctx.arc(X, Y, 17, 0, Math.PI * 2); ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  if (withLabel) label('(x̄, ȳ)', X + 22, Y - 16, C.gold, 17, 'left');
}
function drawFx(dt) {
  for (const b of S.beams) {
    b.t += dt; const a = 1 - b.t / 0.5; if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.gold; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.shadowColor = C.gold; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke(); ctx.restore();
  }
  S.beams = S.beams.filter(b => b.t < 0.5);
  for (const p of S.particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); dot(p.x, p.y, 3.5, p.color); ctx.restore(); }
  S.particles = S.particles.filter(p => p.t < p.life);
  for (const t of S.texts) { t.t += dt; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - t.t / 1.1); label(t.s, t.x, t.y - t.t * 40, t.color, t.size, 'center', 'Press Start 2P', 400); ctx.restore(); }
  S.texts = S.texts.filter(t => t.t < 1.1);
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * (S.speed || 1); last = now; S.t += dt;
  const c = S.count; c.wob = Math.max(0, c.wob - dt * 1.5); c.hurt = Math.max(0, c.hurt - dt); c.sayT = Math.max(0, c.sayT - dt);
  if (S.mode === 'feed') updateFeed(dt);
  if ((S.mode === 'q' || S.mode === 'qresult') && S.q) { S.q.t += dt; if (S.q.update && S.mode === 'q') S.q.update(dt); if (S.q.cards) S.q.cards.forEach(k => k.shake = Math.max(0, k.shake - dt)); }
  ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#110f20'; ctx.fillRect(0, 0, W, H);
  if (S.mode === 'feed') drawFeed();
  else if (S.mode === 'reveal') drawReveal();
  else if ((S.mode === 'q' || S.mode === 'qresult') && S.q) S.q.draw();
  else { drawAxes(); drawPoints(S.pts, 0.8); if (S.mode === 'title') drawPlayerLine(false); }
  drawHUD(); drawCount(); drawFx(dt);
  requestAnimationFrame(frame);
}

// ---------- input ----------
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  const p = toCanvas(e); try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  if (S.mode === 'feed') { if (!feedClick(p.x, p.y)) grabLine(p.x, p.y); }
  else if (S.mode === 'q' && S.q && S.q.down) S.q.down(p.x, p.y);
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  const p = toCanvas(e);
  if (S.mode === 'feed') dragLine(p.x, p.y);
  else if (S.mode === 'q' && S.q && S.q.move) S.q.move(p.x, p.y);
});
const up = () => { releaseLine(); if (S.q && S.q.up) S.q.up(); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
const KEYMAP = { W: 'w', A: 'a', S: 's', D: 'd' };
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.key] || e.key;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k) && e.target.tagName !== 'INPUT') e.preventDefault();
  keys.add(k);
  if (k === 'm' || k === 'M') { soundOn = !soundOn; updateMute(); }
  if (k === ' ' && S.mode === 'feed') fireBlast();
  if (k === 'Enter' && S.enterFn && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { e.preventDefault(); const fn = S.enterFn; fn(); }
  if (S.mode === 'q' && S.q && S.q.key) S.q.key(k);
});
window.addEventListener('keyup', e => { keys.delete(KEYMAP[e.key] || e.key); });
window.addEventListener('blur', () => keys.clear());

// test hooks
S.api = { meteorPos, startFeed, endFeed, nextQuestion, answer, levelSummary, endGame, levelIntro, LEVELS, SCHEDULE, fitOf, r2Of, lineM, lineB, chooseCard, cardRects, sx, sy };

titleScreen();
requestAnimationFrame(frame);
})();
</script>
